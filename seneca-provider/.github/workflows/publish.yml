# merge, then push a v* tag.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deliberately the default-minimum. This job runs third-party code.
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
